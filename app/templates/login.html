<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login - Quiz Master</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card">
    <div class="logo-row">
      <img src="{{ url_for('static', filename='img/logo.png') }}?v=2" alt="Quiz Master">
    </div>
    <h1>Welcome Back</h1>
    <p class="sub">Login to continue your learning journey</p>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for cat, msg in messages %}
        <div class="auth-flash">{{ msg }}</div>
      {% endfor %}
    {% endwith %}

    <form method="post">
      <div class="field">
        <label>Username or Email</label>
        <input type="text" name="identifier" value="{{ identifier }}" required autofocus>
      </div>
      <div class="field">
        <label>Password</label>
        <div class="pw-wrap">
          <input type="password" name="password" id="pw1" required>
          <button type="button" class="pw-toggle" data-target="pw1" aria-label="Show password">👁️</button>
        </div>
      </div>
      <button type="submit" class="btn btn-block">Login</button>
    </form>
    <div class="auth-foot">
      Don't have an account? <a href="{{ url_for('auth.register') }}">Register</a>
    </div>
  </div>
</div>
<script src="{{ url_for('static', filename='js/auth.js') }}"></script>
</body>
</html>
